<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conciliador · JS-Tech</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1f3d;--mut:#64748b;--line:#dde3ec;--pri:#1a2e6e;
  --alta:#0f7a4f;--altabg:#e6f6ee;--media:#a15c00;--mediabg:#fff4e0;--baja:#8a8f98;--bajabg:#f1f3f6;--neg:#b42318;--pos:#0f7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header a{color:#cfe0ff;font-size:12px;margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:14px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none}
.chip b{font-size:17px;display:block}
.chip small{color:var(--mut)}
.chip.on{outline:2px solid var(--pri)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--alta);color:#fff}
.btn.sec{background:#e8edf5;color:var(--ink)}.btn.x{background:#fff;border:1px solid var(--line);color:var(--mut)}
.btn:disabled{opacity:.5;cursor:default}
.mov{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.f{color:var(--mut);font-size:12px;min-width:84px}
.c{flex:1;min-width:200px;font-weight:600;word-break:break-word}
.i{font-weight:800;font-variant-numeric:tabular-nums}
.i.neg{color:var(--neg)}.i.pos{color:var(--pos)}
.cat{font-size:11px;color:var(--mut);background:#eef2f7;border-radius:6px;padding:1px 6px}
.prop{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px;border-radius:9px;flex-wrap:wrap}
.prop.alta{background:var(--altabg)}.prop.media{background:var(--mediabg)}.prop.baja{background:var(--bajabg)}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;color:#fff;text-transform:uppercase}
.badge.alta{background:var(--alta)}.badge.media{background:var(--media)}.badge.baja{background:var(--baja)}
.pt{flex:1;min-width:200px}.pt b{display:block}.pt small{color:#475569}
.mas{font-size:12px;color:var(--pri);cursor:pointer;margin-top:6px;display:inline-block}
select{padding:6px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.vacio{text-align:center;color:var(--mut);padding:30px}
.just{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.just summary{cursor:pointer;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;align-items:flex-start;justify-content:center;z-index:8;padding:20px 10px;overflow:auto}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:14px 16px}
.cand{display:flex;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.cand:hover{background:#f6f8fc}.cand.hecha{opacity:.55}
.cand .ct{flex:1;min-width:0}.cand .ct small{color:var(--mut);display:block}
.cand input[type=number]{width:96px;padding:4px;border:1px solid var(--line);border-radius:6px;text-align:right}
.suma{position:sticky;bottom:0;background:#fff;padding:10px 0 0;margin-top:8px;border-top:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f1f3d;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
@media (max-width:600px){.f{min-width:auto}.c{min-width:100%}}
</style>
</head>
<body>
<header><h1>🧩 Conciliador</h1><span id="anioTxt"></span><a href="https://contable.js-tech.es/">← Panel contable</a></header>
<main>
  <div class="res" id="res"><div class="chip">Cargando…</div></div>
  <div class="bar">
    <button class="btn ok" id="bAltas" disabled>✅ Aceptar todas las de confianza alta</button>
    <button class="btn sec" id="bRec">🔄 Volver a mirar</button>
    <span id="estado" style="color:var(--mut);font-size:12px"></span>
  </div>
  <div id="lista"></div>
  <details class="just" id="reglas"><summary>📏 Tus reglas (<span id="nReglas">0</span>)</summary><div id="reglasTxt" style="margin-top:8px"></div></details>
  <details class="just" id="just"><summary>Justificados sin factura</summary><div id="justTxt" style="margin-top:8px;color:var(--mut)"></div></details>
</main>
<div class="msg" id="msg"></div>
<div class="modal" id="cm"><div class="mbox">
  <div style="display:flex;gap:8px;align-items:center"><b style="font-size:16px">🔗 Casar a mano</b><span style="margin-left:auto"></span><button class="btn x" onclick="cmCerrar()">✕</button></div>
  <div id="cmMov" style="margin:8px 0;padding:8px;background:#f4f6fa;border-radius:8px"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <input id="cmQ" placeholder="Buscar: cliente, proveedor, nº, importe…" style="flex:1;min-width:220px;padding:8px;border:1px solid var(--line);border-radius:8px" oninput="cmPintar()">
    <label style="font-size:12px;color:var(--mut)"><input type="checkbox" id="cmTodas" onchange="cmPintar()"> ver también las ya cobradas/pagadas</label>
  </div>
  <div id="cmLista" style="margin-top:8px;max-height:52vh;overflow:auto"></div>
  <div class="suma"><span id="cmSuma"></span><span style="margin-left:auto"></span>
    <button class="btn ok" id="cmGo" onclick="cmGuardar()">Casar</button></div>
  <div style="font-size:11px;color:var(--mut);margin-top:6px">Casos raros (factura de un año cerrado, devolución de dinero a un cliente) → 🔗 del panel antiguo, pestaña Banco.</div>
</div></div>
<script>
const API='https://panel.js-tech.es';
const ANIO=(new URLSearchParams(location.search).get('anio'))||String(new Date().getFullYear());
let D=null, FILTRO='todos';
const OCULTAS={};   // ✗ = «no es esto»: se esconde esa propuesta (solo en esta pantalla)
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0)+' €';
const fdate=s=>(s||'').slice(0,10).split('-').reverse().join('/');
function aviso(t){ const m=$('#msg'); m.textContent=t; m.style.display='block'; clearTimeout(aviso._t); aviso._t=setTimeout(()=>m.style.display='none',3500); }
function props(m){ return (m.propuestas||[]).filter((p,i)=>!OCULTAS[m.id+':'+i]); }
function mejor(m){ const p=props(m); return p.length?p[0]:null; }
function nivel(m){ const p=mejor(m); return p&&p.aplicar?p.confianza:(p?'baja':'sin'); }

async function cargar(){
  $('#estado').textContent='Mirando el banco y las facturas…'; $('#bAltas').disabled=true;
  try{
    const r=await fetch(API+'/banco/propuestas?anio='+ANIO+'&_='+Date.now()); D=await r.json();
    if(!D.ok) throw new Error(D.error||'error');
  }catch(e){ $('#lista').innerHTML='<div class="vacio">No he podido cargar las propuestas: '+esc(e.message)+'</div>'; $('#estado').textContent=''; return; }
  $('#anioTxt').textContent=D.anio; $('#estado').textContent='';
  pintar();
}
function pintar(){
  const L=D.pendientes||[];
  const n={alta:0,media:0,baja:0,sin:0}; L.forEach(m=>n[nivel(m)]++);
  const R=D.resumen||{};
  const chip=(k,num,txt)=>'<div class="chip'+(FILTRO===k?' on':'')+'" onclick="FILTRO=\''+k+'\';pintar()"><b>'+num+'</b><small>'+txt+'</small></div>';
  $('#res').innerHTML=chip('todos',L.length,'pendientes de '+(R.total||0)+' movimientos')
    +chip('alta',n.alta,'confianza alta')+chip('media',n.media,'confianza media')+chip('baja',n.baja,'solo pista')+chip('sin',n.sin,'sin propuesta')
    +'<div class="chip" style="cursor:default"><b>'+(R.conciliados||0)+'</b><small>conciliados</small></div>'
    +'<div class="chip" style="cursor:default"><b>'+(R.justificados||0)+'</b><small>justificados sin factura</small></div>';
  const b=$('#bAltas'); b.disabled=!n.alta; b.textContent='✅ Aceptar todas las de confianza alta ('+n.alta+')';
  const vis=L.filter(m=>FILTRO==='todos'||nivel(m)===FILTRO);
  $('#lista').innerHTML=vis.length?vis.map(fila).join(''):'<div class="vacio">'+(L.length?'Nada en este filtro.':'✅ No queda nada pendiente de conciliar en '+esc(D.anio)+'.')+'</div>';
  $('#justTxt').innerHTML='Comisiones, impuestos, Seguridad Social, nóminas, seguros, traspasos y aportaciones no llevan factura: se dan por justificados con su categoría. '
    +(R.justificados||0)+' movimientos en '+esc(D.anio)+'.';
}
function cajaProp(m,p,idx){
  const ok=p.aplicar?'<button class="btn ok" onclick="aplicar('+m.id+','+idx+')">✓ Aceptar</button>':'';
  return '<div class="prop '+p.confianza+'"><span class="badge '+p.confianza+'">'+p.confianza+'</span>'
    +'<div class="pt"><b>'+esc(p.etiqueta||'')+'</b><small>'+esc(p.motivo||'')+'</small></div>'+ok
    +'<button class="btn x" title="No es esto" onclick="ocultar('+m.id+','+idx+')">✗</button></div>';
}
function fila(m){
  const P=(m.propuestas||[]).map((p,i)=>({p,i})).filter(x=>!OCULTAS[m.id+':'+x.i]);
  const primera=P.length?cajaProp(m,P[0].p,P[0].i):'<div class="prop baja"><div class="pt"><b>Sin propuesta</b><small>No encuentro nada que case. Ponle categoría o cásalo con «🔗 Casar a mano».</small></div></div>';
  const resto=P.slice(1);
  const otras=resto.length?'<span class="mas" onclick="this.nextElementSibling.style.display=\'block\';this.remove()">Ver '+resto.length+' propuesta(s) más</span><div style="display:none">'+resto.map(x=>cajaProp(m,x.p,x.i)).join('')+'</div>':'';
  const sel='<select onchange="if(this.value)categorizar('+m.id+',this.value)"><option value="">Poner categoría…</option>'
    +(D.categorias||[]).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select>'
    +' <label style="font-size:12px;color:var(--mut);cursor:pointer" title="Crea una regla: los movimientos con este mismo concepto (otros meses, los que vengan) tendrán esta categoría"><input type="checkbox" id="rg'+m.id+'"> y siempre que venga este concepto</label>';
  return '<div class="mov" id="m'+m.id+'"><div class="top"><span class="f">'+fdate(m.fecha)+' · '+esc(m.banco||'')+'</span>'
    +'<span class="c">'+esc(m.concepto)+(m.categoria?' <span class="cat">'+esc(m.categoria)+'</span>':'')+'</span>'
    +'<span class="i '+(m.importe<0?'neg':'pos')+'">'+eur(m.importe)+'</span></div>'
    +primera+otras+'<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sec" onclick="cmAbrir('+m.id+')">🔗 Casar a mano</button>'+sel+'</div></div>';
}
function ocultar(id,idx){ OCULTAS[id+':'+idx]=1; pintar(); }
async function post(id,aplicar){
  const r=await fetch(API+'/banco/propuestas/aplicar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,aplicar})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j.ok) throw new Error(j.error||('error '+r.status));
  return j;
}
function quitar(id){ D.pendientes=(D.pendientes||[]).filter(x=>x.id!==id); }
async function aplicar(id,idx){
  const m=(D.pendientes||[]).find(x=>x.id===id); const p=m&&m.propuestas[idx]; if(!p||!p.aplicar) return;
  try{ await post(id,p.aplicar); quitar(id);
    if(p.aplicar.tipo==='categoria' && !(D.exentas||[]).includes(p.aplicar.categoria)){ aviso('Categoría puesta. «'+p.aplicar.categoria+'» sigue necesitando su justificante.'); await cargar(); return; }
    D.resumen.conciliados+=(p.aplicar.tipo==='categoria'?0:1); if(p.aplicar.tipo==='categoria') D.resumen.justificados++;
    aviso('✅ Hecho'); pintar();
  }catch(e){ alert('No se ha podido aplicar: '+e.message); }
}
async function categorizar(id,cat){
  const rg=document.getElementById('rg'+id);
  if(rg&&rg.checked){
    const m=(D.pendientes||[]).find(x=>x.id===id);
    if(!confirm('Crear la regla:\n\n«'+(m?m.concepto:'')+'»\n→ siempre «'+cat+'»\n\nVale para este concepto en cualquier mes (sin mirar números ni fechas). Se puede borrar en «Tus reglas».')) return;
    try{ const r=await fetch(API+'/banco/reglas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concepto:m?m.concepto:'',categoria:cat})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'error'); }
    catch(e){ alert('No se ha podido crear la regla: '+e.message); return; }
    try{ await post(id,{tipo:'categoria',categoria:cat}); }catch(e){ alert('Regla creada, pero no he podido categorizar este: '+e.message); }
    aviso('📏 Regla creada'); await cargar(); cargarReglas(); return;
  }
  try{ await post(id,{tipo:'categoria',categoria:cat});
    if((D.exentas||[]).includes(cat)){ quitar(id); D.resumen.justificados++; aviso('✅ Justificado como «'+cat+'»'); pintar(); }
    else { aviso('Categoría «'+cat+'» puesta'); await cargar(); }
  }catch(e){ alert('No se ha podido: '+e.message); }
}
$('#bAltas').onclick=async ()=>{
  const L=(D.pendientes||[]).filter(m=>nivel(m)==='alta');
  if(!L.length) return;
  if(!confirm('Aceptar '+L.length+' propuesta(s) de confianza ALTA?\n\nEs reversible: se puede desconciliar en el panel.')) return;
  const b=$('#bAltas'); b.disabled=true; let ok=0, err=[];
  for(const m of L){ const p=mejor(m); b.textContent='Aplicando '+(ok+err.length+1)+'/'+L.length+'…';
    try{ await post(m.id,p.aplicar); ok++; }catch(e){ err.push(fdate(m.fecha)+' '+eur(m.importe)+': '+e.message); } }
  aviso('✅ '+ok+' aplicadas'+(err.length?' · '+err.length+' con error':''));
  if(err.length) alert('No se han podido aplicar:\n\n'+err.join('\n'));
  await cargar();
};
// ═══ 🔗 CASAR A MANO (lo que hacía el 🔗 del panel antiguo) ═══
let CM=null;   // {mov, tipo, cand, sel:{clave:importe}}
const MOTIVOS_DESC=['Gastos de devolución repercutidos','Fallo en la transferencia del cliente','Cliente desaparecido / incobrable','Error de escritura (importe mal tecleado)','Redondeo / céntimos'];
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function cmAbrir(id){
  $('#cm').style.display='flex'; $('#cmLista').innerHTML='<div class="vacio">Buscando facturas…</div>'; $('#cmQ').value=''; $('#cmTodas').checked=false;
  try{ const j=await fetch(API+'/banco/candidatos?id='+id+'&_='+Date.now()).then(r=>r.json()); if(!j.ok) throw new Error(j.error||'error');
    CM={mov:j.mov,tipo:j.tipo,cand:j.candidatos||[],sel:{}};
  }catch(e){ $('#cmLista').innerHTML='<div class="vacio">No he podido cargar las facturas: '+esc(e.message)+'</div>'; return; }
  const m=CM.mov;
  $('#cmMov').innerHTML='<b>'+fdate(m.fecha)+'</b> · '+esc(m.concepto)+' · <b class="i '+(m.importe<0?'neg':'pos')+'">'+eur(m.importe)+'</b><br><small style="color:var(--mut)">'
    +({venta:'Abono → facturas de venta pendientes de cobro',devolucion:'Devolución de recibo → marca la factura de venta como DEVUELTA',proveedor:'Cargo → facturas de proveedor y nóminas pendientes de pago'}[CM.tipo]||'')+'</small>';
  cmPintar(); setTimeout(()=>$('#cmQ').focus(),50);
}
function cmCerrar(){ $('#cm').style.display='none'; CM=null; }
function cmVal(c){ return (c.queda!=null && Math.abs(c.queda)>=0.01) ? c.queda : c.total; }
function cmPintar(){
  if(!CM) return;
  const q=nrm($('#cmQ').value).trim(), todas=$('#cmTodas').checked;
  const qs=q.replace(',','.');
  let L=CM.cand.filter(c=>CM.sel[c.clave]!=null || ((todas||!c.hecha) && (!q || nrm(c.titulo+' '+c.cliente+' '+c.fecha).includes(q) || String(c.total).includes(qs) || String(c.queda).includes(qs))));
  const n=L.length; L=L.slice(0,120);
  $('#cmLista').innerHTML=(L.length?L.map(c=>{ const on=CM.sel[c.clave]!=null;
    return '<div class="cand'+(c.hecha?' hecha':'')+'" onclick="if(event.target.tagName!==\'INPUT\')cmToggle(\''+esc(c.clave).replace(/'/g,'')+'\')">'
      +'<input type="checkbox" '+(on?'checked':'')+' onclick="cmToggle(\''+esc(c.clave).replace(/'/g,'')+'\')">'
      +'<div class="ct"><b>'+esc(c.titulo)+'</b> · '+esc(c.cliente||'')+'<small>'+fdate(c.fecha)+' · total '+eur(c.total)
      +(c.hecha?(c.externo?' · pagada fuera del banco':' · ya '+(CM.tipo==='proveedor'?'pagada':'cobrada')):(Math.abs(c.queda-c.total)>=0.01?' · le quedan '+eur(c.queda):''))+'</small></div>'
      +(on?'<input type="number" step="0.01" value="'+CM.sel[c.clave]+'" title="Importe que se imputa de esta factura" oninput="cmImp(\''+esc(c.clave).replace(/'/g,'')+'\',this.value)">':'<b>'+eur(cmVal(c))+'</b>')
      +'</div>'; }).join(''):'<div class="vacio">Nada con ese filtro.</div>')
    +(n>L.length?'<div style="color:var(--mut);font-size:12px;padding:6px">… y '+(n-L.length)+' más: afina la búsqueda.</div>':'');
  cmSuma();
}
function cmToggle(k){ const c=CM.cand.find(x=>x.clave===k); if(!c) return;
  if(CM.sel[k]!=null) delete CM.sel[k]; else CM.sel[k]=Math.round(cmVal(c)*100)/100; cmPintar(); }
function cmImp(k,v){ CM.sel[k]=Math.round((parseFloat(String(v).replace(',','.'))||0)*100)/100; cmSuma(); }
function cmSuma(){
  const obj=Math.abs(CM.mov.importe), suma=Object.values(CM.sel).reduce((a,b)=>a+b,0), dif=Math.round((obj-suma)*100)/100, n=Object.keys(CM.sel).length;
  $('#cmSuma').innerHTML=n+' marcada(s) · suman <b>'+eur(suma)+'</b> de '+eur(obj)
    +(n?(Math.abs(dif)<0.005?' · <b style="color:var(--alta)">✓ cuadra</b>':' · <b style="color:var(--media)">diferencia '+eur(dif)+'</b>'):'');
  $('#cmGo').disabled=!n;
}
async function cmGuardar(){
  if(!CM) return; const keys=Object.keys(CM.sel); if(!keys.length) return;
  const obj=Math.abs(CM.mov.importe);
  let lista=keys.map(k=>{ const c=CM.cand.find(x=>x.clave===k); return Object.assign({},c.entrada,{importe:CM.sel[k]}); });
  let suma=lista.reduce((a,e)=>a+e.importe,0);
  if(lista.length===1 && suma-obj>=0.01 && CM.tipo!=='devolucion'){
    if(confirm('La factura ('+eur(suma)+') es MAYOR que el movimiento ('+eur(obj)+').\n\n¿Imputar solo '+eur(obj)+' como PAGO A CUENTA? Quedarán '+eur(suma-obj)+' pendientes para otro pago.')){
      lista[0].importe=obj; lista[0].parcial=true; suma=obj; }
  }
  const dif=Math.round((obj-suma)*100)/100;
  if(Math.abs(dif)>=0.005){
    const op=prompt('No cuadra: diferencia de '+eur(dif)+'.\n\n¿Por qué? Escribe el número del motivo o el motivo con tus palabras:\n'
      +MOTIVOS_DESC.map((t,i)=>(i+1)+') '+t).join('\n')+'\n\n(Deja vacío y Aceptar para casar SIN explicar; Cancelar para volver.)','');
    if(op===null) return;
    const t=op.trim(); const txt=/^[1-5]$/.test(t)?MOTIVOS_DESC[+t-1]:t;
    if(txt) lista.push({serie:'DESCUADRE',numero:txt.slice(0,90),importe:dif,cliente:lista[0].cliente||''});
  }
  const b=$('#cmGo'); b.disabled=true; b.textContent='Guardando…';
  try{
    const r=await fetch(API+'/banco/conciliar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:CM.mov.id,facturas:lista})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||('error '+r.status));
    const id=CM.mov.id; cmCerrar(); quitar(id); D.resumen.conciliados++; aviso('✅ Casado'); pintar();
  }catch(e){ alert('No se ha podido casar: '+e.message); }
  finally{ b.disabled=false; b.textContent='Casar'; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && CM) cmCerrar(); });

async function cargarReglas(){
  try{ const j=await fetch(API+'/banco/reglas?_='+Date.now()).then(r=>r.json()); const R=j.reglas||[];
    $('#nReglas').textContent=R.length;
    $('#reglasTxt').innerHTML=R.length?R.map(r=>'<div class="prop baja"><div class="pt"><b>«'+esc(r.patron)+'…» → '+esc(r.categoria)+'</b><small>'
      +r.movimientos+' movimiento(s) con este concepto'+(r.ejemplo?' · ej.: '+esc(r.ejemplo):'')+'</small></div>'
      +'<button class="btn x" onclick="borrarRegla(\''+esc(r.patron).replace(/\\/g,'')+'\')">🗑 Borrar</button></div>').join('')
      :'<div style="color:var(--mut)">Aún no hay reglas. Para crear una: «Poner categoría…» con la casilla «y siempre que venga este concepto».</div>';
  }catch(e){ $('#reglasTxt').textContent='No se han podido cargar las reglas.'; }
}
async function borrarRegla(pat){
  if(!confirm('Borrar la regla «'+pat+'…»?\n\nLo ya categorizado se queda como está.')) return;
  const r=await fetch(API+'/banco/reglas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patron:pat,borrar:true})});
  const j=await r.json().catch(()=>({})); if(!j.ok){ alert('No se ha podido: '+(j.error||r.status)); return; }
  aviso('Regla borrada'); cargarReglas(); cargar();
}
$('#bRec').onclick=cargar;
cargar(); cargarReglas();
</script>
